plugins {
    id 'fabric-loom' version '1.8.13'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'eclipse'
    id 'idea'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    // Ship the sources so the jar can be attached in an IDE.
    withSourcesJar()
}

loom {
    // Fabric's counterpart to Forge's access transformers. Widens the private
    // FallingBlockEntity(Level, double, double, double, BlockState) constructor used by
    // the client-side root visuals.
    accessWidenerPath = file('src/main/resources/smartmobs.accesswidener')

    runs {
        // Loom creates "client" and "server" for us; these blocks only add settings.
        client {
            runDir = 'run'
            // ./gradlew runClient -PquickPlay=<save folder> boots straight into that world.
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            runDir = 'run'
            programArgs '--nogui'
        }
    }
}

repositories {
    // Loom adds the Fabric and Mojang repositories automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Official Mojang mappings, so the vanilla names in this source tree are the same
    // ones the Forge build used (Identifier, Zombie, ServerLevel, ...).
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// Expand the mod metadata properties into fabric.mod.json, the way the Forge build
// expanded them into mods.toml.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version_range: minecraft_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
                             mod_version            : mod_version, mod_authors: mod_authors,
                             mod_description        : mod_description,]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// ./gradlew modrinth  - reads the token from the MODRINTH_TOKEN environment variable,
// which Minotaur picks up on its own. The token never appears in this file.
modrinth {
    projectId = providers.gradleProperty('modrinth_project').orElse(mod_id)
    versionNumber = "${mod_version}+mc${minecraft_version}-fabric"
    versionName = "SmartMobs ${mod_version} - Fabric/Quilt ${minecraft_version}"
    versionType = 'release'
    uploadFile = tasks.remapJar
    gameVersions = [minecraft_version]
    // One file serves both loaders: Quilt Loader runs the Fabric build.
    loaders = ['fabric', 'quilt']
    dependencies {
        required.project 'fabric-api'
    }
    // Only this project syncs the page body, so the text is written once per release.
    syncBodyFrom = file('../../MODRINTH.md').text
    changelog = file('../../CHANGELOG.md').exists() ? file('../../CHANGELOG.md').text : ''
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : mod_authors])
    }
}
