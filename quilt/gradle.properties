org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Minecraft 1.21.x builds on a Java 21 toolchain. A private JDK 21 lives next to the
# loader projects so no system-wide install is required; drop this line if you have one.
org.gradle.java.installations.paths=D:/SmartMobs/.jdk21/jdk-21.0.11+10
# The Minecraft version this mod is built against.
minecraft_version=1.21.11
# Quilt Loader is Minecraft-version independent and runs Fabric mods.
quilt_loader_version=0.30.0
# Quilted Fabric API has no 1.21.11 release, so the mod uses the regular Fabric API,
# which Quilt Loader loads through its Fabric compatibility layer.
fabric_version=0.141.5+1.21.11
mod_id=smartmobs
mod_name=SmartMobs
mod_license=All Rights Reserved
mod_version=2.5
mod_group_id=froz8n
