org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Minecraft 1.20.1 targets Java 17; the JDK 21 toolchain compiles with --release 17. A private JDK 21 lives next to the
# loader projects so no system-wide install is required; drop this line if you have one.
org.gradle.java.installations.paths=D:/SmartMobs/.jdk21/jdk-21.0.11+10
# The Minecraft version this mod is built against.
minecraft_version=1.20.1
# Fabric Loader. Declared as a dependency and used as the lower bound in fabric.mod.json.
loader_version=0.16.14
loader_version_range=>=0.16.0
# Fabric API. The version string already carries the Minecraft version it was built for.
fabric_version=0.92.6+1.20.1
# The Minecraft version range accepted by fabric.mod.json (semver, not Forge's maven ranges).
minecraft_version_range=1.20.1
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the "id" in fabric.mod.json.
mod_id=smartmobs
# The human-readable display name for the mod.
mod_name=SmartMobs
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=2.7
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=froz8n
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=
# Modrinth project this build publishes to.
modrinth_project=Ke1Hvx3v
