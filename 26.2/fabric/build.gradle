plugins {
    id 'fabric-loom' version '1.18.0-alpha.9'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'eclipse'
    id 'idea'
}

group = mod_group_id
version = mod_version

base {
    // Self-describing download: smartmobs-<mc>-fabric-<version>.jar
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    // Ship the sources so the jar can be attached in an IDE.
    withSourcesJar()
}

loom {
    // Minecraft 26.x ships deobfuscated - there is nothing to remap, so Loom runs
    // without intermediary and without a mappings dependency.
    useIntermediateMappings = false

    // Fabric's counterpart to Forge's access transformers. Widens the private
    // FallingBlockEntity(Level, double, double, double, BlockState) constructor used by
    // the client-side root visuals.
    accessWidenerPath = file('src/main/resources/smartmobs.accesswidener')

    runs {
        // Loom creates "client" and "server" for us; these blocks only add settings.
        client {
            runDir = 'run'
            // ./gradlew runClient -PquickPlay=<save folder> boots straight into that world.
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            runDir = 'run'
            programArgs '--nogui'
        }
    }
}

repositories {
    // Loom adds the Fabric and Mojang repositories automatically.
}

/**
 * Minecraft 26.x ships deobfuscated: the client jar carries
 * net/minecraft/world/entity/monster/zombie/Zombie.class verbatim, the version manifest has no
 * client_mappings, and Fabric publishes no intermediary past 1.21.11. There is nothing to remap,
 * but Loom still requires a mappings dependency - officialMojangMappings() fails outright with
 * "Failed to find official mojang mappings for 26.2".
 *
 * So hand it the identity: a tiny v2 file with the two namespaces and no entries. Every name
 * passes through untouched, which is exactly right for a game that is already deobfuscated.
 * Generated rather than committed, so the one thing in it stays readable here.
 */
def identityMappings = layout.buildDirectory.file('identity-mappings.jar').get().asFile
identityMappings.parentFile.mkdirs()
new java.util.zip.ZipOutputStream(identityMappings.newOutputStream()).withCloseable { zip ->
    zip.putNextEntry(new java.util.zip.ZipEntry('mappings/mappings.tiny'))
    // Loom's source remapper insists on an 'intermediary' namespace even with
    // useIntermediateMappings = false, so all three are declared and all three are the same.
    def header = ['tiny', '2', '0', 'official', 'intermediary', 'named'].join(String.valueOf((char) 9)) + (char) 10
    zip.write(header.getBytes('UTF-8'))
    zip.closeEntry()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings files(identityMappings)

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// Expand the mod metadata properties into fabric.mod.json, the way the Forge build
// expanded them into mods.toml.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version_range: minecraft_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
                             mod_version            : mod_version, mod_authors: mod_authors,
                             mod_description        : mod_description,]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// ./gradlew modrinth  - reads the token from the MODRINTH_TOKEN environment variable,
// which Minotaur picks up on its own. The token never appears in this file.
modrinth {
    projectId = providers.gradleProperty('modrinth_project').orElse(mod_id)
    versionNumber = "${mod_version}+mc${minecraft_version}-fabric"
    versionName = "SmartMobs ${mod_version} - Fabric/Quilt ${minecraft_version}"
    // Beta for the whole 26.2 line: it is a brand new Minecraft, and this jar is built
    // through the identity-mapping workaround explained above.
    versionType = 'beta'
    uploadFile = tasks.remapJar
    gameVersions = [minecraft_version]
    // One file serves both loaders: Quilt Loader runs the Fabric build.
    loaders = ['fabric', 'quilt']
    dependencies {
        required.project 'fabric-api'
    }
    // The page body is owned by the 1.21.11 Fabric project; other lines must not rewrite it.
    changelog = file('../../CHANGELOG.md').exists() ? file('../../CHANGELOG.md').getText('UTF-8') : ''
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : mod_authors])
    }
}
