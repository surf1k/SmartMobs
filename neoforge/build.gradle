plugins {
    id 'net.neoforged.moddev' version '2.0.142'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'eclipse'
    id 'idea'
}

group = mod_group_id
version = mod_version

base {
    // Self-describing download: smartmobs-<mc>-neoforge-<version>.jar
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version

    // Same widening the Forge build did through META-INF/accesstransformer.cfg.
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = file('run')
            // ./gradlew runClient -PquickPlay=<save folder> boots straight into that world.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            server()
            gameDirectory = file('run')
            programArguments.addAll '--nogui'
        }
    }

    mods {
        smartmobs {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
}

// Expand the mod metadata properties into neoforge.mods.toml.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version_range: minecraft_version_range,
                             neoforge_version       : neoforge_version,
                             neoforge_version_range : neoforge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
                             mod_version            : mod_version, mod_authors: mod_authors,
                             mod_description        : mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// ./gradlew modrinth  - reads the token from the MODRINTH_TOKEN environment variable,
// which Minotaur picks up on its own. The token never appears in this file.
modrinth {
    projectId = providers.gradleProperty('modrinth_project').orElse(mod_id)
    versionNumber = "${mod_version}+mc${minecraft_version}-neoforge"
    versionName = "SmartMobs ${mod_version} - NeoForge ${minecraft_version}"
    versionType = 'release'
    uploadFile = tasks.jar
    gameVersions = [minecraft_version]
    loaders = ['neoforge']
    changelog = file('../CHANGELOG.md').exists() ? file('../CHANGELOG.md').getText('UTF-8') : ''
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : mod_authors])
    }
}
